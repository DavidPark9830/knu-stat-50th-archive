name: 자료보관함 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 문서와 파일 참조 검사
        run: python3 tools/check.py
      - uses: actions/configure-pages@v5
      - name: 공개 웹문서 준비
        run: |
          mkdir .site
          cp index.html .nojekyll .site/
          cp -R web thumbs docs data .site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - uses: actions/deploy-pages@v4
        id: deployment
